<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatusHub — Server Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col text-slate-800">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-10 w-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-xl font-bold text-slate-900 leading-tight">StatusHub</h1>
            <span id="statTotal" class="text-xs font-semibold px-2 py-0.5 bg-slate-100 border border-slate-200 text-slate-600 rounded-md">0 серверов</span>
          </div>
          <p class="text-xs text-slate-500 font-medium">Инвентаризация серверов и инфраструктуры</p>
        </div>
      </div>

      <button onclick="openModal('addModal')" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-semibold rounded-lg shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 transition-all">
        <svg class="-ml-1 mr-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6-6H6"></path>
        </svg>
        Добавить сервер
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4 justify-between items-center">
      <div class="relative w-full sm:w-80">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <input type="text" id="searchInput" placeholder="Поиск по имени или IP..." oninput="handleSearch()"
          class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div class="flex items-center space-x-3 w-full sm:w-auto">
        <label for="envFilter" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Окружение:</label>
        <select id="envFilter" onchange="loadServers()" class="border border-slate-300 rounded-lg text-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
          <option value="">Все окружения</option>
          <option value="production">Production</option>
          <option value="staging">Staging</option>
          <option value="development">Development</option>
        </select>
        <button onclick="loadServers()" class="p-2 text-slate-500 hover:text-indigo-600 rounded-lg border border-slate-300 hover:border-indigo-500 transition-colors" title="Обновить">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-left">
          <thead class="bg-slate-50">
            <tr>
              <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">ID</th>
              <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">Имя сервера</th>
              <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">IP-адрес</th>
              <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">Окружение</th>
              <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">Статус</th>
              <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">Создан</th>
              <th scope="col" class="px-6 py-3.5 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">Действия</th>
            </tr>
          </thead>
          <tbody id="serversTableBody" class="divide-y divide-slate-200 bg-white text-sm">
            <tr>
              <td colspan="7" class="px-6 py-12 text-center text-slate-400">
                Загрузка данных...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 z-50 transform transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
    <div id="toastContent" class="flex items-center px-4 py-3 rounded-lg shadow-lg text-sm text-white font-medium bg-slate-900">
      <span id="toastMessage"></span>
    </div>
  </div>

  <div id="addModal" class="fixed inset-0 z-40 hidden overflow-y-auto bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-slate-900">Добавить новый сервер</h3>
        <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form onsubmit="handleCreate(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Имя хоста / сервиса *</label>
          <input type="text" id="addName" required placeholder="k8s-worker-01" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">IP-адрес *</label>
          <input type="text" id="addIP" required placeholder="192.168.1.100" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Окружение</label>
            <select id="addEnvironment" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="production">Production</option>
              <option value="staging">Staging</option>
              <option value="development" selected>Development</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Статус</label>
            <select id="addStatus" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="active" selected>Active (В сети)</option>
              <option value="maintenance">Maintenance (Обслуживание)</option>
              <option value="offline">Offline (Отключен)</option>
            </select>
          </div>
        </div>
        <div class="pt-3 flex justify-end space-x-3">
          <button type="button" onclick="closeModal('addModal')" class="px-4 py-2 text-sm font-semibold rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50">Отмена</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm">Создать</button>
        </div>
      </form>
    </div>
  </div>

  <div id="editModal" class="fixed inset-0 z-40 hidden overflow-y-auto bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-slate-900">Редактировать сервер</h3>
        <button onclick="closeModal('editModal')" class="text-slate-400 hover:text-slate-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form onsubmit="handleUpdate(event)" class="space-y-4">
        <input type="hidden" id="editID">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Имя хоста / сервиса *</label>
          <input type="text" id="editName" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">IP-адрес *</label>
          <input type="text" id="editIP" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Окружение</label>
            <select id="editEnvironment" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="production">Production</option>
              <option value="staging">Staging</option>
              <option value="development">Development</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Статус</label>
            <select id="editStatus" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="active">Active (В сети)</option>
              <option value="maintenance">Maintenance (Обслуживание)</option>
              <option value="offline">Offline (Отключен)</option>
            </select>
          </div>
        </div>
        <div class="pt-3 flex justify-end space-x-3">
          <button type="button" onclick="closeModal('editModal')" class="px-4 py-2 text-sm font-semibold rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50">Отмена</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allServers = [];
    let searchTimer;

    function handleSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadServers, 200);
    }

    async function loadServers() {
      const search = document.getElementById('searchInput').value.trim();
      const env = document.getElementById('envFilter').value;
      const params = new URLSearchParams();
      if (env) params.set('environment', env);
      if (search) params.set('search', search);

      const qs = params.toString() ? '?' + params.toString() : '';

      try {
        const res = await fetch('/api/v1/servers' + qs);
        const json = await res.json();
        allServers = json.data || [];
        render();
      } catch (err) {
        document.getElementById('serversTableBody').innerHTML = `
          <tr>
            <td colspan="7" class="px-6 py-8 text-center text-rose-500 font-medium">
              Ошибка соединения с сервером
            </td>
          </tr>
        `;
      }
    }

    function render() {
      const list = allServers;
      const tbody = document.getElementById('serversTableBody');
      document.getElementById('statTotal').innerText = `${list.length} серверов`;

      if (list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="px-6 py-12 text-center text-slate-400">
              <svg class="mx-auto h-10 w-10 text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
              Серверы не найдены
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map(server => `
        <tr class="hover:bg-slate-50/80 transition-colors">
          <td class="px-6 py-4 font-mono text-xs text-slate-500">#${server.id}</td>
          <td class="px-6 py-4 font-semibold text-slate-900">${escapeHtml(server.name)}</td>
          <td class="px-6 py-4 font-mono text-xs text-slate-600">
            <span class="inline-flex items-center space-x-1.5 bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200">
              <span>${escapeHtml(server.ip_address)}</span>
            </span>
          </td>
          <td class="px-6 py-4">${renderEnvironmentBadge(server.environment)}</td>
          <td class="px-6 py-4">${renderStatusBadge(server.status)}</td>
          <td class="px-6 py-4 text-xs text-slate-500">${new Date(server.created_at).toLocaleString('ru-RU')}</td>
          <td class="px-6 py-4 text-right space-x-3">
            <button onclick="editServer(${server.id})" class="text-indigo-600 hover:text-indigo-900 font-semibold text-xs">
              Редактировать
            </button>
            <button onclick="deleteServer(${server.id})" class="text-rose-600 hover:text-rose-900 font-semibold text-xs">
              Удалить
            </button>
          </td>
        </tr>
      `).join('');
    }

    function editServer(id) {
      const server = allServers.find(s => s.id === id);
      if (!server) return;
      document.getElementById('editID').value = server.id;
      document.getElementById('editName').value = server.name;
      document.getElementById('editIP').value = server.ip_address;
      document.getElementById('editEnvironment').value = server.environment;
      document.getElementById('editStatus').value = server.status;
      openModal('editModal');
    }

    async function handleCreate(event) {
      event.preventDefault();
      const body = {
        name: document.getElementById('addName').value,
        ip_address: document.getElementById('addIP').value,
        environment: document.getElementById('addEnvironment').value,
        status: document.getElementById('addStatus').value
      };

      try {
        const res = await fetch('/api/v1/servers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();
        if (json.success) {
          showToast('Сервер успешно добавлен!', 'success');
          closeModal('addModal');
          event.target.reset();
          loadServers();
        } else {
          showToast(json.error || 'Ошибка при создании', 'error');
        }
      } catch (err) {
        showToast('Сетевая ошибка', 'error');
      }
    }

    async function handleUpdate(event) {
      event.preventDefault();
      const id = document.getElementById('editID').value;
      const body = {
        name: document.getElementById('editName').value,
        ip_address: document.getElementById('editIP').value,
        environment: document.getElementById('editEnvironment').value,
        status: document.getElementById('editStatus').value
      };

      try {
        const res = await fetch(`/api/v1/servers/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();
        if (json.success) {
          showToast('Данные сервера обновлены!', 'success');
          closeModal('editModal');
          loadServers();
        } else {
          showToast(json.error || 'Ошибка обновления', 'error');
        }
      } catch (err) {
        showToast('Сетевая ошибка', 'error');
      }
    }

    async function deleteServer(id) {
      const server = allServers.find(s => s.id === id);
      const name = server ? server.name : id;
      if (!confirm(`Вы действительно хотите удалить сервер "${name}" (ID: ${id})?`)) return;

      try {
        const res = await fetch(`/api/v1/servers/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          showToast(`Сервер "${name}" удален`, 'info');
          loadServers();
        } else {
          showToast(json.error || 'Ошибка при удалении', 'error');
        }
      } catch (err) {
        showToast('Сетевая ошибка', 'error');
      }
    }

    function renderStatusBadge(status) {
      switch (status) {
        case 'active':
          return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">● В сети</span>';
        case 'maintenance':
          return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">● Обслуживание</span>';
        case 'offline':
          return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-100 text-rose-800">● Офлайн</span>';
        default:
          return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${status}</span>`;
      }
    }

    function renderEnvironmentBadge(env) {
      switch (env) {
        case 'production':
          return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-purple-100 text-purple-800 border border-purple-200">PROD</span>';
        case 'staging':
          return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-800 border border-blue-200">STAGE</span>';
        case 'development':
          return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200">DEV</span>';
        default:
          return env;
      }
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const toastContent = document.getElementById('toastContent');
      const toastMsg = document.getElementById('toastMessage');

      toastMsg.innerText = msg;
      toastContent.className = 'flex items-center px-4 py-3 rounded-lg shadow-lg text-sm text-white font-medium ' +
        (type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-900');

      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 3500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    document.addEventListener('DOMContentLoaded', loadServers);
  </script>
</body>
</html>
