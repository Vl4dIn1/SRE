---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
# stringData автоматически кодируется Kubernetes в base64 при создании ресурса
stringData:
  POSTGRES_PASSWORD: "postgrespassword"
# Эквивалент в base64 секции data:
# data:
#   POSTGRES_PASSWORD: cG9zdGdyZXNwYXNzd29yZA==
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: status-hub
type: Opaque
stringData:
  DB_PASSWORD: "postgrespassword"
# Эквивалент в base64 секции data:
# data:
#   DB_PASSWORD: cG9zdGdyZXNwYXNzd29yZA==
