apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: monitoring
  labels:
    app: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
      - name: vmalert
        image: victoriametrics/vmalert:v1.102.0
        args:
          - "-rule=/etc/vmalert/rules/*.yaml"
          - "-datasource.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428"
          - "-notifier.url=http://alertmanager.monitoring.svc.cluster.local:9093"
          - "-evaluationInterval=10s"
          - "-httpListenAddr=:8880"
        ports:
          - name: http
            containerPort: 8880
        volumeMounts:
          - name: rules-volume
            mountPath: /etc/vmalert/rules
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
      volumes:
        - name: rules-volume
          configMap:
            name: alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: monitoring
  labels:
    app: vmalert
spec:
  type: ClusterIP
  selector:
    app: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: 8880
