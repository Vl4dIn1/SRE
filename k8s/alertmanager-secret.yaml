apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yml: |
    route:
      group_by: ["alertname", "service"]
      group_wait: 5s
      group_interval: 10s
      receiver: "telegram-alerts"
      
    receivers:
      - name: "telegram-alerts"
        telegram_configs:
            - bot_token: "<YOUR_TELEGRAM_BOT_TOKEN>"
              chat_id: <YOUR_TELEGRAM_CHAT_ID>
              send_resolved: true
              parse_mode: "HTML"
              message: |
                {{ if eq .Status "firing" }}🔥 <b>[ALERT FIRING]</b> {{ .CommonAnnotations.summary }}{{ else }}✅ <b>[RESOLVED]</b> {{ .CommonAnnotations.summary }}{{ end }}
                <b>Важность:</b> {{ .CommonLabels.severity }}
                <b>Сервис:</b> {{ .CommonLabels.service }}
                <b>Описание:</b> {{ .CommonAnnotations.description }}
