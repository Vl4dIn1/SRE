apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: status-hub

spec:
  replicas: 1
  selector:
    matchLabels: 
      app: status-hub
  template:
    metadata:
      labels:
        app: status-hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: status-hub
          image: status-hub:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgrespassword@postgres-service:5432/server_inventory?sslmode=disable"
