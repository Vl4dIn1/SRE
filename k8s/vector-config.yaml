apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      k8s_logs:
        type: kubernetes_logs

    transforms:
      parse_app_logs:
        type: remap
        inputs:
          - k8s_logs
        source: |
          if .kubernetes.pod_labels.app == "status-hub" {
            parsed, _ = parse_json(.message)
            if is_object(parsed) {
              ., _ = merge(., parsed)
            }
          }

    sinks:
      victoria_logs:
        type: elasticsearch
        inputs:
          - parse_app_logs
        endpoints:
          - "http://victoria-logs-service:9428/insert/elasticsearch/"
        api_version: "v8"
        compression: "gzip"
        healthcheck:
          enabled: false
        query:
          _msg_field: "message"
          _time_field: "timestamp"
          _stream_fields: "stream,kubernetes.pod_name"