apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      group_by: ['alertname', 'service']
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 30m
      receiver: 'all-notifications'

    receivers:
    - name: 'all-notifications'
      webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
      # Telegram Bot интеграция:
      # Для включения отправки в Telegram раскомментируйте блок ниже и укажите свои токен и chat_id:
      # telegram_configs:
      # - bot_token: '<TELEGRAM_BOT_TOKEN>'
      #   chat_id: <TELEGRAM_CHAT_ID>
      #   send_resolved: true
      #   parse_mode: 'HTML'
      #   message: |
      #     {{ if eq .Status "firing" }}🔥 <b>[ALERT FIRING]</b> {{ .CommonAnnotations.summary }}{{ else }}✅ <b>[RESOLVED]</b> {{ .CommonAnnotations.summary }}{{ end }}
      #     <b>Важность:</b> {{ .CommonLabels.severity }}
      #     <b>Сервис:</b> {{ .CommonLabels.service }}
      #     <b>Описание:</b> {{ .CommonAnnotations.description }}
      #     <b>Время:</b> {{ (index .Alerts 0).StartsAt.Format "15:04:05 02-01-2006" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
          - "--config.file=/etc/alertmanager/alertmanager.yml"
          - "--storage.path=/alertmanager"
          - "--web.external-url=http://localhost:9093"
        ports:
          - name: http
            containerPort: 9093
        volumeMounts:
          - name: config-volume
            mountPath: /etc/alertmanager
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
      - name: notification-receiver
        image: notification-receiver:latest
        imagePullPolicy: IfNotPresent
        ports:
          - name: receiver-http
            containerPort: 5001
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "20m"
            memory: "32Mi"
      volumes:
        - name: config-volume
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
    - name: receiver-http
      port: 5001
      targetPort: 5001
