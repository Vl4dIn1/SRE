---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    app: postgres
data:
  POSTGRES_DB: "server_inventory"
  POSTGRES_USER: "postgres"
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: status-hub
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "server_inventory"
  DB_USER: "postgres"
  PORT: "8080"
